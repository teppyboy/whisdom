name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck app
        run: pnpm typecheck

      - name: Typecheck worker
        run: pnpm --filter whisdom-worker typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  server:
    name: Build server (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ffmpeg

      - name: Build server
        working-directory: server
        run: cargo build --release

  release-companion:
    name: Release Desktop Companion
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, server]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Companion
        working-directory: companion/src-tauri
        run: cargo build --release

      - name: Verify Companion executable
        shell: pwsh
        run: Get-Item companion/src-tauri/target/release/whisdom-companion.exe

      - name: Move latest release tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f companion-latest "${{ github.sha }}"
          git push --force origin refs/tags/companion-latest

      - name: Publish Companion executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-latest
          name: Whisdom Companion (latest)
          body: Built from ${{ github.sha }}.
          files: companion/src-tauri/target/release/whisdom-companion.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
