name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck app
        run: pnpm typecheck

      - name: Typecheck worker
        run: pnpm --filter whisdom-worker typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  server:
    name: Build server (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ffmpeg

      - name: Refresh Sherpa-ONNX prebuilt libraries
        working-directory: server
        run: rm -rf target

      - name: Build server
        working-directory: server
        run: cargo build --release

  release-companion:
    name: Release Desktop Companion
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, server]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: D:\c
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.357.0
          destination: C:\VulkanSDK
          install_runtime: true
          cache: true

      - name: Verify Vulkan toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC compiler was not found on PATH"
          }
          Get-Command cl.exe -ErrorAction Stop | Out-Null
          if (-not $env:VULKAN_SDK) {
            throw "VULKAN_SDK was not exported by the Vulkan SDK action"
          }
          if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
            throw "Ninja was not found on PATH"
          }
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_BUILD_PARALLEL_LEVEL=1" >> $env:GITHUB_ENV
          $required = @(
            (Join-Path $env:VULKAN_SDK "Include\vulkan\vulkan.h"),
            (Join-Path $env:VULKAN_SDK "Lib\vulkan-1.lib"),
            (Join-Path $env:VULKAN_SDK "Bin\glslc.exe")
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Vulkan SDK file not found: $path"
            }
          }
          Write-Output "VULKAN_SDK=$env:VULKAN_SDK"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Companion release version
        shell: pwsh
        run: |
          $config = Get-Content companion/src-tauri/tauri.conf.json |
            ConvertFrom-Json
          $config.version = "0.0.${{ github.run_number }}"
          $config |
            ConvertTo-Json -Depth 20 |
            Set-Content companion/src-tauri/tauri.conf.json

      - name: Build pinned sherpa-onnx DirectML runtime
        shell: pwsh
        run: |
          $env:Path = "${env:ProgramFiles}\CMake\bin;${env:Path}"
          & "$env:GITHUB_WORKSPACE/scripts/build-sherpa-directml.ps1" `
            -BuildDir "D:\sdml-build" `
            -Generator "Visual Studio 18 2026"
          if ($LASTEXITCODE -ne 0) {
            throw "DirectML sherpa build failed: $LASTEXITCODE"
          }
          $libPath = Join-Path $env:GITHUB_WORKSPACE `
            "native/sherpa-directml/lib"
          $libDir = (Resolve-Path $libPath).Path
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE `
            "native/sherpa-directml/manifest.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "DirectML bundle manifest missing: $manifestPath"
          }
          "SHERPA_ONNX_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          Write-Output "SHERPA_ONNX_LIB_DIR=$libDir"

      - name: Prepare Companion runtime DLLs
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $targetRoot = $env:CARGO_TARGET_DIR
          $releaseDir = Join-Path $targetRoot "$target/release"
          cargo build --release --target $target `
            --target-dir $targetRoot `
            --manifest-path "companion/src-tauri/Cargo.toml" `
            --features "vulkan,directml"
          $bundleBin = Join-Path $env:GITHUB_WORKSPACE `
            "native/sherpa-directml/bin"
          $bundleDlls = @(Get-ChildItem -LiteralPath $bundleBin `
            -Filter '*.dll' -File)
          if (-not $bundleDlls) {
            throw "No DirectML runtime DLLs found in $bundleBin"
          }
          foreach ($dll in $bundleDlls) {
            Copy-Item -LiteralPath $dll.FullName `
              -Destination (Join-Path $releaseDir $dll.Name) -Force
          }
          $runtimeDlls = @(Get-ChildItem -LiteralPath $releaseDir `
            -Filter '*.dll' -File)
          if (-not $runtimeDlls) {
            throw "No runtime DLLs found in $releaseDir"
          }
          $requiredDirectML = @(
            'sherpa-onnx-c-api.dll',
            'onnxruntime.dll',
            'DirectML.dll'
          )
          foreach ($name in $requiredDirectML) {
            if (-not ($runtimeDlls.Name -contains $name)) {
              $path = Join-Path $releaseDir $name
              throw "Required DirectML runtime DLL not found: $path"
            }
          }
          $dllNames = $runtimeDlls.Name -join ', '
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist/bin"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item -LiteralPath $runtimeDlls.FullName `
            -Destination $distDir -Force
          $configPath = Join-Path $env:GITHUB_WORKSPACE `
            "companion/src-tauri/tauri.conf.json"
          $resourceMap = @{}
          foreach ($dll in $runtimeDlls) {
            $resourceMap[$dll.FullName] = $dll.Name
          }
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.resources = $resourceMap
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath
          $configCheck = Get-Content $configPath -Raw | ConvertFrom-Json
          $mappedResources = @(
            $configCheck.bundle.resources.psobject.Properties
          )
          Write-Output "Runtime DLLs: $dllNames"
          foreach ($name in $requiredDirectML) {
            if (-not ($mappedResources.Value -contains $name)) {
              throw "Missing mapped DirectML runtime DLL: $name"
            }
          }
          foreach ($dll in $runtimeDlls) {
            if (-not ($mappedResources.Value -contains $dll.Name)) {
              throw "Runtime DLL was not mapped beside the executable: " +
                $dll.Name
            }
          }

      - name: Publish Companion updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          tauriScript: pnpm exec tauri
          tagName: companion-v__VERSION__
          releaseName: Whisdom Companion v__VERSION__
          releaseBody: Signed Windows installer and updater artifacts.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target x86_64-pc-windows-msvc --features vulkan,directml
          retryAttempts: 3

      - name: Validate Companion installer resources
        shell: pwsh
        run: |
          $targetRoot = $env:CARGO_TARGET_DIR
          $releaseDir = Join-Path $targetRoot "x86_64-pc-windows-msvc\release"
          $nsisDir = Join-Path $releaseDir "bundle\nsis"
          $installer = Get-ChildItem -LiteralPath $nsisDir `
            -Filter "*.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found under $nsisDir"
          }
          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if (-not $sevenZip) {
            $sevenZipPath = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
            if (Test-Path -LiteralPath $sevenZipPath -PathType Leaf) {
              $sevenZip = Get-Item -LiteralPath $sevenZipPath
            }
          }
          if (-not $sevenZip) {
            throw "7z.exe is required to inspect the NSIS installer"
          }
          $archiveEntries = & $sevenZip.Source l -slt $installer.FullName |
            Where-Object { $_ -like "Path = *" } |
            ForEach-Object { $_.Substring(7) }
          foreach ($name in @(
              "sherpa-onnx-c-api.dll",
              "sherpa-onnx-cxx-api.dll",
              "onnxruntime.dll",
              "DirectML.dll"
            )) {
            if (-not ($archiveEntries -contains $name)) {
              throw "Installer does not place $name beside the executable"
            }
          }
          Write-Output "Installer resources are beside the executable"

  release-companion-macos:
    name: Release Desktop Companion (macOS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [release-companion]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Companion release version
        run: |
          node -e "
            const fs = require('fs')
            const path = 'companion/src-tauri/tauri.conf.json'
            const config = JSON.parse(fs.readFileSync(path, 'utf8'))
            config.version = '0.0.${{ github.run_number }}'
            fs.writeFileSync(path, JSON.stringify(config, null, 2))
          "

      - name: Build Companion (Metal)
        run: |
          cargo build --release \
            --manifest-path companion/src-tauri/Cargo.toml \
            --features metal

      - name: Publish Companion DMG
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: companion
          tauriScript: pnpm exec tauri
          tagName: companion-v__VERSION__
          releaseName: Whisdom Companion v__VERSION__
          releaseBody: >-
            macOS DMG (Apple silicon, Metal).
            Ad-hoc signed, no updater.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          args: >-
            --features metal
            --bundles dmg
            --config
            '{"bundle":{"createUpdaterArtifacts":false}}'

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
