name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck app
        run: pnpm typecheck

      - name: Typecheck worker
        run: pnpm --filter whisdom-worker typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  server:
    name: Build server (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ffmpeg

      - name: Refresh Sherpa-ONNX prebuilt libraries
        working-directory: server
        run: rm -rf target

      - name: Build server
        working-directory: server
        run: cargo build --release

  release-companion:
    name: Release Desktop Companion
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, server]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: D:\c
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC compiler was not found on PATH"
          }
          Get-Command cl.exe -ErrorAction Stop | Out-Null
          Write-Output "MSVC compiler ready"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Companion release version
        shell: pwsh
        run: |
          $config = Get-Content companion/src-tauri/tauri.conf.json |
            ConvertFrom-Json
          $config.version = "0.0.${{ github.run_number }}"
          $config |
            ConvertTo-Json -Depth 20 |
            Set-Content companion/src-tauri/tauri.conf.json

      - name: Build pinned sherpa-onnx DirectML runtime
        shell: pwsh
        run: |
          $env:Path = "${env:ProgramFiles}\CMake\bin;${env:Path}"
          & "$env:GITHUB_WORKSPACE/scripts/build-sherpa-directml.ps1" `
            -BuildDir "D:\sdml-build" `
            -Generator "Visual Studio 18 2026"
          if ($LASTEXITCODE -ne 0) {
            throw "DirectML sherpa build failed: $LASTEXITCODE"
          }
          $libPath = Join-Path $env:GITHUB_WORKSPACE `
            "native/sherpa-directml/lib"
          $libDir = (Resolve-Path $libPath).Path
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE `
            "native/sherpa-directml/manifest.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "DirectML bundle manifest missing: $manifestPath"
          }
          "SHERPA_ONNX_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          Write-Output "SHERPA_ONNX_LIB_DIR=$libDir"

      - name: Prepare Companion runtime DLLs
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $targetRoot = $env:CARGO_TARGET_DIR
          $releaseDir = Join-Path $targetRoot "$target/release"
          cargo build --release --target $target `
            --target-dir $targetRoot `
            --manifest-path "companion/src-tauri/Cargo.toml" `
            --features "directml"
          $bundleBin = Join-Path $env:GITHUB_WORKSPACE `
            "native/sherpa-directml/bin"
          $bundleDlls = @(Get-ChildItem -LiteralPath $bundleBin `
            -Filter '*.dll' -File)
          if (-not $bundleDlls) {
            throw "No DirectML runtime DLLs found in $bundleBin"
          }
          foreach ($dll in $bundleDlls) {
            Copy-Item -LiteralPath $dll.FullName `
              -Destination (Join-Path $releaseDir $dll.Name) -Force
          }
          $runtimeDlls = @(Get-ChildItem -LiteralPath $releaseDir `
            -Filter '*.dll' -File)
          if (-not $runtimeDlls) {
            throw "No runtime DLLs found in $releaseDir"
          }
          $requiredDirectML = @(
            'sherpa-onnx-c-api.dll',
            'onnxruntime.dll',
            'DirectML.dll'
          )
          foreach ($name in $requiredDirectML) {
            if (-not ($runtimeDlls.Name -contains $name)) {
              $path = Join-Path $releaseDir $name
              throw "Required DirectML runtime DLL not found: $path"
            }
          }
          $dllNames = $runtimeDlls.Name -join ', '
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist/bin"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item -LiteralPath $runtimeDlls.FullName `
            -Destination $distDir -Force
          $configPath = Join-Path $env:GITHUB_WORKSPACE `
            "companion/src-tauri/tauri.conf.json"
          $resourcePaths = @($runtimeDlls.FullName)
          $resourceJson = ConvertTo-Json -InputObject $resourcePaths `
            -Compress
          $configJson = Get-Content $configPath -Raw
          $configJson = $configJson -replace `
            '"resources"\s*:\s*\{\}',
            ('"resources":' + $resourceJson)
          if ($configJson -notmatch '"resources"\s*:\s*\[') {
            throw "Tauri resource array was not written"
          }
          Set-Content $configPath $configJson
          Write-Output "Runtime DLLs: $dllNames"
          foreach ($name in $requiredDirectML) {
            if ($resourceJson -notmatch [regex]::Escape($name)) {
              throw "Missing mapped DirectML runtime DLL: $name"
            }
          }

      - name: Publish Companion updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          tauriScript: pnpm exec tauri
          tagName: companion-v__VERSION__
          releaseName: Whisdom Companion v__VERSION__
          releaseBody: Signed Windows installer and updater artifacts.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target x86_64-pc-windows-msvc --features directml
          retryAttempts: 3

      - name: Package portable Companion ZIP
        shell: pwsh
        run: |
          $targetRoot = $env:CARGO_TARGET_DIR
          $releaseDirs = @(
            (Join-Path $targetRoot "x86_64-pc-windows-msvc\release"),
            (Join-Path $targetRoot "release")
          )
          $releaseDir = $releaseDirs |
            Where-Object {
              Test-Path (Join-Path $_ "whisdom-companion.exe")
            } |
            Select-Object -First 1
          if (-not $releaseDir) {
            throw "Built companion release directory not found: $targetRoot"
          }
          $stagingDir = Join-Path $env:RUNNER_TEMP `
            "whisdom-companion-portable"
          $zip = Join-Path $env:GITHUB_WORKSPACE `
            "dist\bin\whisdom-companion-portable.zip"
          Remove-Item -LiteralPath $stagingDir -Recurse -Force `
            -ErrorAction SilentlyContinue
          $zipDir = Split-Path -Parent $zip
          New-Item -ItemType Directory -Force `
            -Path @($stagingDir, $zipDir) | Out-Null

          $binary = Join-Path $releaseDir "whisdom-companion.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Built companion binary not found: $binary"
          }

          $runtimeDlls = @(Get-ChildItem -LiteralPath $releaseDir `
            -Filter "*.dll" -File)
          $requiredDirectML = @(
            "sherpa-onnx-c-api.dll",
            "onnxruntime.dll",
            "DirectML.dll"
          )
          foreach ($name in $requiredDirectML) {
            if (-not ($runtimeDlls.Name -contains $name)) {
              $path = Join-Path $releaseDir $name
              throw "Required DirectML runtime DLL not found: $path"
            }
          }

          Copy-Item -LiteralPath $binary -Destination $stagingDir -Force
          Copy-Item -LiteralPath $runtimeDlls.FullName `
            -Destination $stagingDir -Force
          $stagingFiles = Join-Path $stagingDir "*"
          Compress-Archive -Path $stagingFiles -DestinationPath $zip `
            -Force
          $archiveEntries = tar.exe -tf $zip
          foreach ($name in $requiredDirectML) {
            if (-not ($archiveEntries -contains $name)) {
              throw "Portable package missing $name"
            }
          }
          Write-Output "Portable package: $zip"
          Write-Output "Runtime DLLs: $($runtimeDlls.Name -join ', ')"

      - name: Upload portable Companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisdom-companion-portable
          path: dist/bin/whisdom-companion-portable.zip
          if-no-files-found: error

      - name: Upload portable ZIP to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "companion-v0.0.${{ github.run_number }}" `
            "dist/bin/whisdom-companion-portable.zip" `
            --clobber

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
