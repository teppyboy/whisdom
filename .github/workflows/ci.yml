name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck app
        run: pnpm typecheck

      - name: Typecheck worker
        run: pnpm --filter whisdom-worker typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  server:
    name: Build server (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ffmpeg

      - name: Refresh Sherpa-ONNX prebuilt libraries
        working-directory: server
        run: rm -rf target

      - name: Build server
        working-directory: server
        run: cargo build --release

  release-companion:
    name: Release Desktop Companion
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, server]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Companion release version
        shell: pwsh
        run: |
          $config = Get-Content companion/src-tauri/tauri.conf.json |
            ConvertFrom-Json
          $config.version = "0.0.${{ github.run_number }}"
          $config |
            ConvertTo-Json -Depth 20 |
            Set-Content companion/src-tauri/tauri.conf.json

      - name: Prepare Companion runtime DLLs
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          $manifest = "companion/src-tauri/Cargo.toml"
          $targetRoot = "companion/src-tauri/target"
          $releaseDir = Join-Path $targetRoot "$target/release"
          cargo build --release --target $target --manifest-path $manifest
          $requiredDll = Join-Path $releaseDir "sherpa-onnx-c-api.dll"
          if (-not (Test-Path -LiteralPath $requiredDll -PathType Leaf)) {
            throw "Required sherpa runtime DLL not found: $requiredDll"
          }
          $runtimeDlls = @(Get-ChildItem -LiteralPath $releaseDir `
            -Filter '*.dll' -File)
          if (-not $runtimeDlls) {
            throw "No runtime DLLs found in $releaseDir"
          }
          $dllNames = $runtimeDlls.Name -join ', '
          $distDir = Join-Path $env:GITHUB_WORKSPACE "dist/bin"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item -LiteralPath $runtimeDlls.FullName `
            -Destination $distDir -Force
          $configPath = Join-Path $env:GITHUB_WORKSPACE `
            "companion/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.resources = @{ "../../dist/bin/*.dll" = "" }
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath
          Write-Output "Runtime DLLs: $dllNames"

      - name: Build and publish Companion updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: >-
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          tauriScript: pnpm exec tauri
          tagName: companion-v__VERSION__
          releaseName: Whisdom Companion v__VERSION__
          releaseBody: Signed Windows installer and updater artifacts.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target x86_64-pc-windows-msvc
          retryAttempts: 3

      - name: Package portable Companion ZIP
        shell: pwsh
        run: |
          $targetRoot = Join-Path $env:GITHUB_WORKSPACE `
            "companion\src-tauri\target"
          $releaseDirs = @(
            (Join-Path $targetRoot "x86_64-pc-windows-msvc\release"),
            (Join-Path $targetRoot "release")
          )
          $releaseDir = $releaseDirs |
            Where-Object {
              Test-Path (Join-Path $_ "whisdom-companion.exe")
            } |
            Select-Object -First 1
          if (-not $releaseDir) {
            throw "Built companion release directory not found: $targetRoot"
          }
          $stagingDir = Join-Path $env:RUNNER_TEMP `
            "whisdom-companion-portable"
          $zip = Join-Path $env:GITHUB_WORKSPACE `
            "dist\bin\whisdom-companion-portable.zip"
          Remove-Item -LiteralPath $stagingDir -Recurse -Force `
            -ErrorAction SilentlyContinue
          $zipDir = Split-Path -Parent $zip
          New-Item -ItemType Directory -Force `
            -Path @($stagingDir, $zipDir) | Out-Null

          $binary = Join-Path $releaseDir "whisdom-companion.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Built companion binary not found: $binary"
          }

          $runtimeDlls = @(Get-ChildItem -LiteralPath $releaseDir `
            -Filter "*.dll" -File)
          $requiredDll = Join-Path $releaseDir "sherpa-onnx-c-api.dll"
          if (-not ($runtimeDlls.Name -contains "sherpa-onnx-c-api.dll")) {
            throw "Required sherpa runtime DLL not found: $requiredDll"
          }

          Copy-Item -LiteralPath $binary -Destination $stagingDir -Force
          Copy-Item -LiteralPath $runtimeDlls.FullName `
            -Destination $stagingDir -Force
          $stagingFiles = Join-Path $stagingDir "*"
          Compress-Archive -Path $stagingFiles -DestinationPath $zip `
            -Force
          Write-Output "Portable package: $zip"
          Write-Output "Runtime DLLs: $($runtimeDlls.Name -join ', ')"

      - name: Upload portable Companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisdom-companion-portable
          path: dist/bin/whisdom-companion-portable.zip
          if-no-files-found: error

      - name: Upload portable ZIP to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "companion-v0.0.${{ github.run_number }}" `
            "dist/bin/whisdom-companion-portable.zip" `
            --clobber

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
