[package]
name = "whisdom-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
sha2 = "0.11"
hex = "0.4"
zip = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1.25", features = ["v4"] }
thiserror = "2"
tempfile = "3"
futures = "0.3"
dotenvy = "0.15"
toml = "1.1"
whisper-rs = "0.16"
hound = "3"

[lib]
name = "whisdom_server"
path = "src/lib.rs"

[[bin]]
name = "whisdom-server"
path = "src/main.rs"

[[bin]]
name = "whisdom-helper"
path = "src/bin/whisdom-helper.rs"

[features]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
hipblas = ["whisper-rs/hipblas"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
